[mcp_servers.angular-cli]
command = "npx"
args = [
    "--no-install",
    "ng",
    "mcp",
]

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]

[mcp_servers.codebase-memory]
command = "npx"
args = [
    "-y",
    "codebase-memory-mcp",
]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.glossa]
url = "https://glossa.andersseen.dev/mcp"
bearer_token_env_var = "GLOSSA_TOKEN"

[mcp_servers.ngp-mcp]
command = "npx"
args = [
    "--no-install",
    "ngp-mcp",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
    "--browser",
    "chromium",
]

[mcp_servers.volt-ui]
url = "https://volt-ui.pages.dev/api/mcp"
