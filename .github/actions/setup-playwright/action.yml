name: Setup Playwright browser
description: Installs a Playwright browser (Chromium by default) and its OS packages, restoring the browser download from the cache when the Playwright version has not changed. Run after the setup action.

inputs:
  browser:
    description: chromium, firefox or webkit
    default: chromium

runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache the browser download
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser }}

    - name: Download the browser and install its OS packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps ${{ inputs.browser }}

    # The browser is cached, the apt packages it needs are not.
    - name: Install the browser's OS packages
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps ${{ inputs.browser }}
