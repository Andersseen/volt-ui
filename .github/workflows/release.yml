name: Release

# Publishes after CI has passed on main, instead of repeating CI. This workflow used to re-run
# lint, typecheck, the generated-file checks, the unit tests and every e2e suite on each push to
# main (about eight serial minutes), which is the same work the CI workflow had just done on the
# same commit, and it failed whenever something outside the commit moved in between (a Glossa
# catalog edit, for instance). Now it waits for CI to succeed and only builds and validates the
# packages it is about to publish.
#
# A manual run (workflow_dispatch) has no CI behind it, so it keeps the full gate.
#
# The release script is idempotent: it publishes only packages whose local version is new on npm
# and creates a GitHub Release for each, so releases appear in the repo sidebar.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create git tags + GitHub Releases

jobs:
  release:
    name: Publish changed packages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The commit CI just verified, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history so release notes can diff from the last tag

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Authenticate to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only a manual run needs these: on workflow_run, CI has already passed them.
      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck

      - name: Check committed generated files are current
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:generated

      - name: Check generated AI and component documentation
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:ai-docs

      - name: Run unit tests with enforced coverage
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build:lib

      - name: Validate all publishable packages
        run: pnpm pack:lib && pnpm pack:cli && pnpm pack:agent

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-playwright

      - name: Run docs and consumer end-to-end tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e:ci && pnpm test:e2e:consumer && pnpm test:e2e:consumer-cli

      - name: Publish new versions & create releases
        run: node scripts/release.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
