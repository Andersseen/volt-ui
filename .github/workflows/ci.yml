name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pipeline used to be one 15-20 minute serial job. These run side by side; `verify` at the end
  # keeps the old check name so branch protection and `deploy` need no change. The slow server-render
  # and e2e suites are sharded: wall time is the slowest shard, not the sum.

  static:
    name: Lint · typecheck · generated files · docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check committed generated files are current
        run: pnpm check:generated

      - name: Check generated AI and component documentation
        run: pnpm check:ai-docs

      - name: Check docs completeness and colour contrast
        run: pnpm check:docs-completeness && pnpm check:contrast

  unit:
    name: Unit tests (coverage enforced)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run unit tests with enforced coverage
        run: pnpm test:coverage

  packages:
    name: Library, CLI and agent packages · consumer e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build library
        run: pnpm build:lib

      - name: Compile copied Blocks and Layouts in a consumer workspace
        run: node scripts/check-copied-source.mjs

      - name: Check CLI package
        run: pnpm pack:cli

      - name: Check library package
        run: pnpm pack:lib

      - name: Check MCP installer package
        run: pnpm pack:mcp

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run consumer fixture e2e tests
        run: pnpm test:e2e:consumer

      - name: Run CLI consumer fixture e2e tests
        run: pnpm test:e2e:consumer-cli

  build:
    name: Build docs app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build application
        run: pnpm build

      - name: Upload build for the e2e and SSR jobs
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: dist
          include-hidden-files: true # .well-known and .nitro live under dist
          retention-days: 1

  e2e:
    name: Docs e2e (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-files
          path: dist

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/2
        env:
          E2E_SERVER: preview
          E2E_PORT: 5174

  ssr:
    name: Server render and hydration (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-files
          path: dist

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Server-render the gallery in the Cloudflare worker
        run: pnpm check:ssr --shard ${{ matrix.shard }}/4

      - name: Hydrate the gallery in the Cloudflare worker
        run: pnpm exec playwright test e2e/ssr-gallery.spec.ts --project=chromium --shard=${{ matrix.shard }}/4
        env:
          E2E_SERVER: wrangler
          E2E_PORT: 8799

  # One required check, whatever the number of jobs above.
  verify:
    name: Verify · lint · typecheck · test · build · e2e
    needs: [static, unit, packages, build, e2e, ssr]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://volt-ui.andersseen.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Build application
        run: pnpm build
        env:
          # Umami tracker is baked in at build time. Values are public by design
          # (they ship in the page HTML); repo vars can override the defaults.
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL || 'https://umami.andersseen.dev/script.js' }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || '5baf0049-5fed-401f-a71c-eb6af6ef3166' }}

      - name: Deploy to Cloudflare Pages
        # Must match the Pages project's "Production branch" setting in the Cloudflare
        # dashboard (main) - wrangler only tags a deployment "Production" (the environment
        # the custom domain serves) when --branch matches that setting. A literal
        # --branch=production does not mean "the production environment": it deploys under
        # a branch that happens to be *named* production, which Cloudflare treats as an
        # ordinary Preview deployment. See git blame on this line before changing it again.
        run: pnpm exec wrangler pages deploy dist/analog/public --project-name=volt-ui --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
