name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify · lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated AI and component documentation
        run: pnpm check:ai-docs

      - name: Run unit tests with enforced coverage
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build:lib

      - name: Check CLI package
        run: pnpm pack:cli

      - name: Check library package
        run: pnpm pack:lib

      - name: Check MCP installer package
        run: pnpm pack:mcp

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pnpm test:e2e:ci

      - name: Run consumer fixture e2e tests
        run: pnpm test:e2e:consumer

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/analog/public
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://volt-ui.andersseen.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Build application
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist/analog/public --project-name=volt-ui --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
