name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pipeline used to be one 15-20 minute serial job. These run side by side; `verify` at the end
  # keeps the old check name so branch protection and `deploy` need no change. The slow server-render
  # and e2e suites are sharded: wall time is the slowest shard, not the sum.

  static:
    name: Lint · typecheck · generated files · docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck Volt UI Recipes
        run: pnpm typecheck:recipes

      - name: Check committed generated files are current
        run: pnpm check:generated

      - name: Check the site dogfoods Volt
        run: pnpm check:dogfood

      - name: Check generated AI and component documentation
        run: pnpm check:ai-docs

      - name: Check docs completeness and colour contrast
        run: pnpm check:docs-completeness && pnpm check:contrast

  unit:
    name: Unit tests (coverage enforced)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run unit tests with enforced coverage
        run: pnpm test:coverage

  packages:
    name: Library, CLI and agent packages · consumer e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build library
        run: pnpm build:lib

      - name: Compile copied Blocks, Layouts and Recipes in a consumer workspace
        run: node scripts/check-copied-source.mjs

      # The CLI package bundles the manifest; unit tests used to generate it as a side effect.
      - name: Generate the CLI manifest
        run: pnpm manifest

      - name: Check CLI package
        run: pnpm pack:cli

      - name: Check library package
        run: pnpm pack:lib

      - name: Check MCP installer package
        run: pnpm pack:agent

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Run consumer fixture e2e tests
        run: pnpm test:e2e:consumer

      - name: Run CLI consumer fixture e2e tests
        run: pnpm test:e2e:consumer-cli

  contracts:
    name: Component contracts (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build library
        run: pnpm build:lib

      - name: Install Playwright ${{ matrix.browser }}
        uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}

      # Focus, keyboard, pointer geometry, portals, drag and drop and computed styles against the
      # built package: what jsdom cannot prove. See e2e/contracts and playwright.contracts.config.ts.
      - name: Run component contract tests
        run: pnpm exec playwright test -c playwright.contracts.config.ts --project=${{ matrix.browser }}

  compat:
    name: Packed package on Angular ${{ matrix.angular }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        angular: [21, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      # Packs the real tarball, installs it with Angular ${{ matrix.angular }} into a project outside
      # the repository, compiles it with that major's own ng build and runs the browser contracts
      # against the result. A peer range that excludes the major fails at the install.
      - name: Install, build and exercise the tarball
        run: node scripts/check-angular-compat.mjs ${{ matrix.angular }}

  quartz:
    name: Quartz backend on Angular ${{ matrix.angular }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 21.2.0 is the declared minimum; 22 needs --legacy-peer-deps while Quartz 0.16 declares ^21 peers.
        angular: [21.2.0, 21, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright
      - name: Install Playwright Firefox
        uses: ./.github/actions/setup-playwright
        with:
          browser: firefox
      - name: Install Playwright WebKit
        uses: ./.github/actions/setup-playwright
        with:
          browser: webkit

      # Packs the real tarball, installs it with the published Quartz packages into a project outside
      # the repository, builds four apps (package and CLI copy, each engine) with strict AOT, zoneless
      # and prerendered SSR, checks that neither engine leaks into the other's bundle, then runs the
      # Forms/keyboard/hydration/paint contract in all three browsers. See scripts/check-quartz-consumer.mjs.
      - name: Install, build and exercise the Quartz backend
        run: node scripts/check-quartz-consumer.mjs ${{ matrix.angular }}

  build:
    name: Build docs app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build application
        run: pnpm build

      - name: Upload build for the e2e and SSR jobs
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: dist
          include-hidden-files: true # .well-known and .nitro live under dist
          retention-days: 1

  # The second application. Built on its own, so a docs-site failure never hides a Recipes one
  # (and the other way round); both feed `verify`.
  build-recipes:
    name: Build Recipes app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build Recipes
        run: pnpm build:recipes

      - name: Upload build for the Recipes checks
        uses: actions/upload-artifact@v7
        with:
          name: build-recipes-files
          path: dist/apps/recipes
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Docs e2e (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-files
          path: dist

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Run e2e smoke tests
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/2
        env:
          E2E_SERVER: preview
          E2E_PORT: 5174

  ssr:
    name: Server render and hydration (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-files
          path: dist

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Server-render the docs pages in the Cloudflare worker
        run: pnpm check:ssr --shard ${{ matrix.shard }}/4

      # The raw HTML a crawler receives: titles, canonical, hreflang, Open Graph, JSON-LD, robots,
      # sitemap and llms.txt, served by the same worker as production. Once is enough.
      - name: Check search metadata in the server-rendered HTML
        if: matrix.shard == 1
        run: pnpm check:seo

      - name: Hydrate the docs pages in the Cloudflare worker
        run: pnpm exec playwright test e2e/ssr-docs.spec.ts --project=chromium --shard=${{ matrix.shard }}/4
        env:
          E2E_SERVER: wrangler
          E2E_PORT: 8799

      # blocks/layouts/recipes left this site: every old URL must 301 to recipes.voltui.dev, in each
      # locale, without touching an unrelated route. Served by the same worker as production.
      - name: Check the legacy gallery redirects
        if: matrix.shard == 1
        run: pnpm exec playwright test e2e/legacy-redirects.spec.ts --project=chromium
        env:
          E2E_SERVER: wrangler
          E2E_PORT: 8799

  recipes:
    name: Recipes · server render · hydration · e2e · SEO
    needs: build-recipes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-recipes-files
          path: dist/apps/recipes

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Server-render every Recipes route in the Cloudflare worker
        run: pnpm check:ssr:recipes

      - name: Check search metadata in the server-rendered HTML
        run: node scripts/check-seo.mjs --app recipes

      # Routes, live previews, source and copy, canonical origin, theme persistence, the
      # theme x viewport sweep, reduced motion, and hydration — against the built worker.
      - name: Run Recipes e2e in the Cloudflare worker
        run: pnpm exec playwright test -c playwright.recipes.config.ts --project=chromium
        env:
          E2E_SERVER: wrangler
          E2E_PORT: 8798

  storybook:
    name: Storybook · typecheck · coverage · build · smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Typecheck stories against the public API
        run: pnpm typecheck:storybook

      - name: Check every public component has stories
        run: pnpm check:storybook

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Smoke-test the static Storybook
        run: pnpm test:storybook

      - name: Upload Storybook for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: dist/storybook
          retention-days: 1

  # One required check, whatever the number of jobs above.
  verify:
    name: Verify · lint · typecheck · test · build · e2e
    needs:
      [
        static,
        unit,
        packages,
        contracts,
        compat,
        quartz,
        build,
        build-recipes,
        e2e,
        ssr,
        recipes,
        storybook,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done

  # Volt UI Recipes is its own Cloudflare Pages project (`volt-ui-recipes`, https://recipes.voltui.dev).
  # GitHub Actions owns its production deployments: do not also connect the project to Git in the
  # Cloudflare dashboard, or every push deploys twice. Opt-in, like Storybook: set the repository
  # variable RECIPES_DEPLOY=true once the Pages project and the custom domain exist
  # (docs/recipes-app.md "Deploying"). Until then this job is skipped, not failed.
  deploy-recipes:
    name: Deploy Recipes to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RECIPES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: recipes
      url: https://recipes.voltui.dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build library
        run: pnpm build:lib

      - name: Build Recipes
        run: pnpm build:recipes

      # --branch must match the Pages project's production branch (main): wrangler only tags a
      # deployment "Production", the environment the custom domain serves, when they match.
      # From the app's folder, so apps/recipes/wrangler.toml (output dir, compatibility date) applies.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/recipes
        run: pnpm exec wrangler pages deploy --project-name=volt-ui-recipes --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy to Cloudflare Pages
    # The docs build redirects every old /docs/{blocks,layouts,recipes}/* URL to recipes.voltui.dev, so
    # it must never go live ahead of its destination. When Recipes deploys in the same run, wait for it.
    needs: [verify, deploy-recipes]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      (needs.deploy-recipes.result == 'success' || needs.deploy-recipes.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://voltui.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The legacy-gallery redirects point here. A 301 to an unprovisioned domain is worse than a 404.
      # Up to three minutes: right after deploy-recipes publishes, the custom domain can lag behind.
      - name: Require Volt UI Recipes to be live
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://recipes.voltui.dev/blocks/hero || true)
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::https://recipes.voltui.dev/blocks/hero answered $code. Deploy Volt UI Recipes first (docs/recipes-app.md)."
          exit 1

      - name: Build library
        run: pnpm build:lib

      - name: Build application
        run: pnpm build
        env:
          # Umami tracker is baked in at build time. Values are public by design
          # (they ship in the page HTML); repo vars can override the defaults.
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL || 'https://umami.andersseen.dev/script.js' }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || '5baf0049-5fed-401f-a71c-eb6af6ef3166' }}

      - name: Deploy to Cloudflare Pages
        # Must match the Pages project's "Production branch" setting in the Cloudflare
        # dashboard (main) - wrangler only tags a deployment "Production" (the environment
        # the custom domain serves) when --branch matches that setting. A literal
        # --branch=production does not mean "the production environment": it deploys under
        # a branch that happens to be *named* production, which Cloudflare treats as an
        # ordinary Preview deployment. See git blame on this line before changing it again.
        # From the app's folder, so apps/web/wrangler.toml (output dir, compatibility date) applies.
        working-directory: apps/web
        run: pnpm exec wrangler pages deploy --project-name=volt-ui --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Storybook is published to its own Cloudflare Pages project (https://storybook.voltui.dev). It is
  # opt-in: set the repository variable STORYBOOK_DEPLOY=true once the `volt-ui-storybook` Pages
  # project exists (see AGENTS.md "Storybook"). Until then this job is skipped, not failed.
  deploy-storybook:
    name: Deploy Storybook to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STORYBOOK_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: storybook
      url: https://storybook.voltui.dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Download the Storybook built by CI
        uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: dist/storybook

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist/storybook --project-name=volt-ui-storybook --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
