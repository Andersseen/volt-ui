version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
      testing:
        patterns:
          - '@playwright/*'
          - '@testing-library/*'
          - 'vitest'
          - '@vitest/*'
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
