<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">Progress</h1>
    <p class="text-base text-muted-foreground mt-2">
      Displays an indicator showing the completion progress of a task.
    </p>
  </div>

  <div class="w-full h-px bg-border"></div>

  <!-- Usage Example -->
  <app-code-panel title="Usage" [code]="progressUsage" [tabbed]="true">
    <div
      class="p-8 border border-border rounded-lg bg-card/30 flex items-center justify-center min-h-[300px]"
    >
      <div class="w-full max-w-sm space-y-4">
        <volt-progress [value]="value()">
          <div class="mb-2 flex items-center justify-between gap-3">
            <volt-progress-label>Upload progress</volt-progress-label>
            <volt-progress-value>{{ value() }}% complete</volt-progress-value>
          </div>
        </volt-progress>
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">API Reference</h3>
    <app-api-reference [data]="progressApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    title="Component Source"
    [code]="progressCode"
    cliCommand="npx @voltui/cli add progress"
    description="Copy this code to your project. The component uses ng-primitives/progress."
  />
</div>
