<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">
      {{ t('components.radio.title') }}
    </h1>
    <p class="text-base text-muted-foreground mt-2">{{ t('components.radio.description') }}</p>
  </div>

  <div class="w-full h-px bg-border"></div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="radioUsage" [tabbed]="true">
    <div
      class="p-8 border border-border rounded-lg bg-card/30 flex items-center justify-center min-h-[300px]"
    >
      <volt-radio-group orientation="vertical" value="default">
        <volt-radio-item value="default">Default</volt-radio-item>
        <volt-radio-item value="comfortable">Comfortable</volt-radio-item>
        <volt-radio-item value="compact">Compact</volt-radio-item>
      </volt-radio-group>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="radioApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="radioCode"
    cliCommand="npx @voltui/cli add radio"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/radio' })"
  />
</div>
