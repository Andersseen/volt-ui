<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">{{ t('components.input.title') }}</h1>
    <p class="text-lg text-muted-foreground mt-2">{{ t('components.input.description') }}</p>
  </div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="inputUsage" [tabbed]="true">
    <div
      class="border rounded-xl border-border/50 p-6 md:p-10 bg-background/50 relative overflow-hidden"
    >
      <div
        class="relative z-10 max-w-sm mx-auto space-y-8 bg-background p-6 rounded-lg shadow-sm border border-border/50"
      >
        <div class="space-y-2">
          <volt-label htmlFor="email">Email</volt-label>
          <volt-input type="email" id="email" placeholder="Email" />
          <p class="text-sm text-muted-foreground">Enter your email address.</p>
        </div>

        <div class="space-y-2">
          <volt-label htmlFor="file">File</volt-label>
          <volt-input type="file" id="file" />
        </div>

        <div class="space-y-2">
          <volt-label htmlFor="message">Message (Textarea)</volt-label>
          <volt-textarea
            id="message"
            placeholder="Type your message here."
            [rows]="4"
          ></volt-textarea>
        </div>
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="inputApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="inputCode"
    cliCommand="npx @voltui/cli add input"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/input' })"
  />
</div>
