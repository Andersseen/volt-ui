<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">
      {{ t('components.toggle.title') }}
    </h1>
    <p class="text-base text-muted-foreground mt-2">{{ t('components.toggle.description') }}</p>
  </div>

  <div class="w-full h-px bg-border"></div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="toggleUsage" [tabbed]="true">
    <div
      class="p-8 border border-border rounded-lg bg-card/30 flex items-center justify-center min-h-[300px] gap-4"
    >
      <volt-toggle aria-label="Toggle italic" [(pressed)]="italic">
        <lmn-italic [size]="16" />
      </volt-toggle>

      <volt-toggle variant="outline" aria-label="Toggle bold" [(pressed)]="bold">
        <lmn-bold [size]="16" />
      </volt-toggle>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="toggleApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="toggleCode"
    cliCommand="npx @voltui/cli add toggle"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/toggle' })"
  />
</div>
