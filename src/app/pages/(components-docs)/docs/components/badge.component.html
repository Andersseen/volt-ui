<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">{{ t('components.badge.title') }}</h1>
    <p class="text-lg text-muted-foreground mt-2">{{ t('components.badge.description') }}</p>
  </div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="badgeUsage" [tabbed]="true">
    <div
      class="border rounded-xl border-border/50 p-6 md:p-10 flex flex-col items-center justify-center bg-background/50 relative overflow-hidden min-h-[300px]"
    >
      <div class="relative z-10 flex flex-wrap gap-4 justify-center items-center">
        <volt-badge variant="solid">Solid</volt-badge>
        <volt-badge variant="secondary">Secondary</volt-badge>
        <volt-badge variant="outline">Outline</volt-badge>
        <volt-badge variant="destructive">Destructive</volt-badge>
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="badgeApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="badgeCode"
    cliCommand="npx @voltui/cli add badge"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'class-variance-authority' })"
  />
</div>
