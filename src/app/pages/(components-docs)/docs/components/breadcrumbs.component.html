<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">
      {{ t('components.breadcrumbs.title') }}
    </h1>
    <p class="text-base text-muted-foreground mt-2">
      {{ t('components.breadcrumbs.description') }}
    </p>
  </div>

  <div class="w-full h-px bg-border"></div>

  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="breadcrumbsUsage" [tabbed]="true">
    <div
      class="p-8 border border-border rounded-lg bg-card/30 flex items-center justify-center min-h-[300px]"
    >
      <volt-breadcrumbs>
        <volt-breadcrumb-list>
          <volt-breadcrumb-item>
            <volt-breadcrumb-link href="/">Home</volt-breadcrumb-link>
          </volt-breadcrumb-item>
          <volt-breadcrumb-separator />
          <volt-breadcrumb-item>
            <volt-breadcrumb-link href="/docs/components">Components</volt-breadcrumb-link>
          </volt-breadcrumb-item>
          <volt-breadcrumb-separator />
          <volt-breadcrumb-item>
            <volt-breadcrumb-page>Breadcrumbs</volt-breadcrumb-page>
          </volt-breadcrumb-item>
        </volt-breadcrumb-list>
      </volt-breadcrumbs>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="breadcrumbsApi" />
  </div>

  <app-code-panel
    [code]="breadcrumbsCode"
    cliCommand="npx @voltui/cli add breadcrumbs"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/breadcrumbs' })"
  />
</div>
