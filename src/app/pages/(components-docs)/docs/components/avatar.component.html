<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">{{ t('components.avatar.title') }}</h1>
    <p class="text-lg text-muted-foreground mt-2">{{ t('components.avatar.description') }}</p>
  </div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="avatarUsage" [tabbed]="true">
    <div
      class="border rounded-xl border-border/50 p-6 md:p-10 flex flex-col items-center justify-center bg-background/50 relative overflow-hidden min-h-[300px]"
    >
      <div class="relative z-10 flex gap-4">
        <volt-avatar>
          <img voltAvatarImage src="https://github.com/shadcn.png" alt="@shadcn" />
          <volt-avatar-fallback>CN</volt-avatar-fallback>
        </volt-avatar>

        <volt-avatar>
          <img
            voltAvatarImage
            src="https://i.pravatar.cc/150?u=a042581f4e29026704d"
            alt="@janedoe"
          />
          <volt-avatar-fallback>JD</volt-avatar-fallback>
        </volt-avatar>

        <volt-avatar>
          <volt-avatar-fallback>AP</volt-avatar-fallback>
        </volt-avatar>
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="avatarApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="avatarCode"
    cliCommand="npx @voltui/cli add avatar"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/avatar' })"
  />
</div>
