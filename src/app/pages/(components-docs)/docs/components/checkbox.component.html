<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">{{ t('components.checkbox.title') }}</h1>
    <p class="text-lg text-muted-foreground mt-2">{{ t('components.checkbox.description') }}</p>
  </div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="checkboxUsage" [tabbed]="true">
    <div
      class="border rounded-xl border-border/50 p-6 md:p-10 flex flex-col items-center justify-center bg-background/50 relative overflow-hidden min-h-[300px]"
    >
      <div
        class="relative z-10 flex items-center space-x-3 bg-background p-6 rounded-lg shadow-sm border border-border/50"
      >
        <volt-checkbox id="terms"></volt-checkbox>
        <div class="grid gap-1.5 leading-none">
          <volt-label
            htmlFor="terms"
            class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 flex items-center cursor-pointer"
          >
            Accept terms and conditions
          </volt-label>
          <p class="text-sm text-muted-foreground">
            You agree to our Terms of Service and Privacy Policy.
          </p>
        </div>
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="checkboxApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="checkboxCode"
    cliCommand="npx @voltui/cli add checkbox"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/checkbox' })"
  />
</div>
