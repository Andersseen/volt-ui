<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">
      {{ t('components.popover.title') }}
    </h1>
    <p class="text-base text-muted-foreground mt-2">{{ t('components.popover.description') }}</p>
  </div>

  <div class="w-full h-px bg-border"></div>

  <div class="space-y-4">
    <h2 class="text-xl font-semibold tracking-tight text-foreground">
      {{ t('ui.section.example') }}
    </h2>
    <div
      class="p-8 border border-border rounded-lg bg-card/30 flex items-center justify-center min-h-[300px]"
    >
      <volt-button variant="outline" [voltPopover]="myPopover" placement="bottom">
        Open Popover
      </volt-button>

      <ng-template #myPopover>
        <volt-popover-content>
          <div class="space-y-2">
            <h4 class="font-medium leading-none">Dimensions</h4>
            <p class="text-sm text-muted-foreground">Set the dimensions for the layer.</p>
          </div>
        </volt-popover-content>
      </ng-template>
    </div>
  </div>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="popoverApi" />
  </div>

  <app-code-panel
    [code]="popoverCode"
    cliCommand="npx @voltui/cli add popover"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/popover' })"
  />
</div>
