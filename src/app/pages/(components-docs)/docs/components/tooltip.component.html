<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">
      {{ t('components.tooltip.title') }}
    </h1>
    <p class="text-base text-muted-foreground mt-2">{{ t('components.tooltip.description') }}</p>
  </div>

  <div class="w-full h-px bg-border"></div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="tooltipUsage" [tabbed]="true">
    <div
      class="p-8 border border-border rounded-lg bg-card/30 flex items-center justify-center min-h-[300px]"
    >
      <volt-button variant="outline" [voltTooltip]="myTooltip" placement="top" [offset]="8">
        Hover me
      </volt-button>

      <ng-template #myTooltip>
        <volt-tooltip-content>Add to library</volt-tooltip-content>
      </ng-template>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="tooltipApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="tooltipCode"
    cliCommand="npx @voltui/cli add tooltip"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/tooltip' })"
  />
</div>
