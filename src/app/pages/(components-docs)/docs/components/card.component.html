<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">{{ t('components.card.title') }}</h1>
    <p class="text-lg text-muted-foreground mt-2">{{ t('components.card.description') }}</p>
  </div>

  <!-- Usage Example -->
  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="cardUsage" [tabbed]="true">
    <div
      class="border rounded-xl border-border/50 p-6 md:p-10 flex items-center justify-center bg-background/50 relative overflow-hidden min-h-[400px]"
    >
      <div class="relative z-10 w-full max-w-[350px]">
        <volt-card>
          <volt-card-header>
            <volt-card-title>Create project</volt-card-title>
            <volt-card-description>Deploy your new project in one-click.</volt-card-description>
          </volt-card-header>
          <volt-card-content>
            <form>
              <volt-form-field>
                <volt-label>Name</volt-label>
                <volt-input placeholder="Name of your project" />
              </volt-form-field>
            </form>
          </volt-card-content>
          <volt-card-footer class="justify-between">
            <button voltButton variant="outline" type="button">Cancel</button>
            <button voltButton type="button">Deploy</button>
          </volt-card-footer>
        </volt-card>

        <volt-card class="mt-6" data-testid="card-custom">
          <volt-card-content class="p-3 md:p-4 text-center">
            <p class="text-sm text-muted-foreground">No deployments yet</p>
          </volt-card-content>
          <volt-card-footer class="justify-end gap-2 border-t border-border p-3">
            <button voltButton variant="ghost" size="sm" type="button">Dismiss</button>
            <button voltButton size="sm" type="button">Deploy now</button>
          </volt-card-footer>
        </volt-card>
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="cardApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="cardCode"
    cliCommand="npx @voltui/cli add card"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'class-variance-authority for variants' })"
  />
</div>
