<div class="space-y-6">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">{{ t('components.switch.title') }}</h1>
    <p class="text-lg text-muted-foreground mt-2">{{ t('components.switch.description') }}</p>
  </div>

  <app-code-panel [title]="t('ui.codePanel.usage')" [code]="switchUsage" [tabbed]="true">
    <div
      class="border rounded-xl border-border/50 p-6 md:p-10 flex flex-col items-center justify-center bg-background/50 relative overflow-hidden min-h-[300px]"
    >
      <div
        class="relative z-10 flex items-center space-x-3 bg-background p-6 rounded-lg shadow-sm border border-border/50"
      >
        <volt-switch id="airplane-mode" [(checked)]="enabled"></volt-switch>
        <volt-label htmlFor="airplane-mode" class="cursor-pointer select-none"
          >Airplane Mode</volt-label
        >
      </div>
    </div>
  </app-code-panel>

  <!-- API Reference -->
  <div class="space-y-3">
    <h3 class="text-lg font-semibold">{{ t('ui.api.title') }}</h3>
    <app-api-reference [data]="switchApi" />
  </div>

  <!-- Source Code Section -->
  <app-code-panel
    [code]="switchCode"
    cliCommand="npx @voltui/cli add switch"
    [description]="t('ui.codePanel.copyNoteDep', { dep: 'ng-primitives/switch' })"
  />
</div>
